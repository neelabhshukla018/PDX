<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D312E" />
      <stop offset="100%" stop-color="#1C1D1F" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="20" y="20" width="360" height="360" rx="72" fill="#FBFBF9" stroke="#E7E7E0" stroke-width="4" />
  
  <!-- Outer Hex/Shield Badge -->
  <rect x="70" y="70" width="260" height="260" rx="52" fill="url(#emeraldGrad)" filter="url(#shadow)" />
  
  <!-- Document Sheet Silhouette -->
  <path d="M130 115 L230 115 L270 155 L270 285 L130 285 Z" fill="#FFFFFF" opacity="0.95" />
  <path d="M230 115 L230 155 L270 155 Z" fill="#E2E8F0" />
  
  <!-- "R" / Tech Lightning Nodes -->
  <path d="M160 160 L205 160 C220 160 230 170 230 185 C230 198 220 208 205 208 L180 208 L180 245" stroke="#047857" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <line x1="160" y1="160" x2="160" y2="245" stroke="#047857" stroke-width="14" stroke-linecap="round" />
  <line x1="200" y1="208" x2="230" y2="245" stroke="#10B981" stroke-width="14" stroke-linecap="round" />

  <!-- Neural Sparks / Vectors -->
  <circle cx="245" cy="185" r="7" fill="#10B981" />
  <circle cx="160" cy="138" r="5" fill="#10B981" />
</svg>
